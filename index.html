<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babyly — The local marketplace for parents</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:     #A4C8D8;
      --blue-mid: #7AAFC3;
      --blue-deep:#4A8FA8;
      --cream:    #F9F6F2;
      --text:     #1A1A1A;
      --muted:    #7A7A7A;
      --white:    #FFFFFF;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--cream);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(249,246,242,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-wordmark {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text); }

    /* ── HERO ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 600px;
      height: 600px;
      background: none;
      pointer-events: none;
    }

    .hero-icon {
      width: 96px;
      height: 96px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(164,200,216,0.35);
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--blue-mid);
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .hero-headline {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.1;
      letter-spacing: -1px;
      color: var(--text);
      max-width: 640px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }



    .hero-sub {
      font-size: 18px;
      font-weight: 500;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    .hero-cta-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--blue);
      color: var(--white);
      border-radius: 100px;
      min-width: 160px;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: var(--blue-mid);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: transparent;
      color: var(--text);
      border: 1.5px solid rgba(26,26,26,0.15);
      border-radius: 100px;
      min-width: 160px;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.15s;
    }

    .btn-secondary:hover {
      border-color: rgba(26,26,26,0.35);
      transform: translateY(-1px);
    }



    /* ── FOOTER ── */
    footer {
      background: var(--text);
      color: rgba(255,255,255,0.5);
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-wordmark {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--white);
    }

    .footer-links {
      display: flex;
      gap: 24px;
      list-style: none;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--white); }

    .footer-copy {
      font-size: 13px;
      font-weight: 500;
      width: 100%;
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .nav-links { display: none; }
      footer { padding: 32px 20px; }
      .hero-cta-group { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <span class="nav-wordmark">Babyly</span>
    <ul class="nav-links">
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <img
      src="babyly-logo.png"
      alt="Babyly"
      class="hero-icon"
    />
    <h1 class="hero-headline">
      Buy, sell, and give away<br />
      children's items locally.
    </h1>
    <p class="hero-sub">
      A neighborhood marketplace built for parents —
      no shipping, no strangers, no hassle.
    </p>
    <div class="hero-cta-group">
      <a href="#" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a href="#" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17c0-.83 1-.8 1.5-.47l14 8.5c.45.28.45.96 0 1.24l-14 8.5C3.5 21.6 3 21.33 3 20.5z"/></svg>
        Google Play
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <span class="footer-wordmark">Babyly</span>
    <ul class="footer-links">
      <li><a href="/privacy">Privacy Policy</a></li>
      <li><a href="/terms">Terms of Service</a></li>
      <li><a href="/support">Support</a></li>
    </ul>
    <p class="footer-copy">© 2026 Babyly. All rights reserved.</p>
  </footer>

</body>
</html>
